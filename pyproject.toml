[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "xxxxdoll-product-sync"
version = "0.1.0"
description = "A safe foundation for a future product synchronization worker."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "google-api-python-client>=2,<3",
    "google-auth>=2,<3",
    "google-auth-httplib2>=0.2,<1",
    "PySocks>=1.7,<2",
]

[tool.setuptools.packages.find]
where = ["src"]
